name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt imageio-ffmpeg==0.6.0
      - run: python -m unittest discover -s tests -v
      - run: dotnet run --project tests/YiLocal.Checks -c Release
      - if: runner.os == 'Windows'
        run: dotnet build YiLocal.sln -c Release --nologo
      - run: python scripts/check_media_integration.py
      - run: python scripts/check_recording_profiles.py
      - run: python scripts/check_audio_integration.py
      - run: python scripts/check_motion_integration.py
      - if: runner.os == 'Windows'
        run: python scripts/check_player_integration.py
      - if: runner.os == 'Windows'
        run: dotnet run --project tests/YiLocal.Windows.Checks -c Release -- --settings
      - if: runner.os == 'Windows'
        run: python scripts/check_talk_integration.py
      - if: runner.os == 'Windows'
        run: python scripts/check_alarm_integration.py
